name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript strict)
        run: npm run typecheck
      - name: Testes (core + reproduções do legado + golden master)
        run: npm test
      - name: Sintaxe do legado
        run: npm --prefix game run check
